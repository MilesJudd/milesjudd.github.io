<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic-Tac-Toe — Miles R. W. Judd</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css"> <!-- adjust path if needed -->
  <meta name="description" content="A small Tic-Tac-Toe game in the same style as the site.">
</head>

<body>

  <!-- Early reveal snippet: run ASAP so the page isn't hidden -->
  <script>
    (function () {
      try {
        function init() {
          document.body.style.overflow = '';
          document.body.classList.add('page-visible');
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else init();
      } catch (e) {
        try { document.body.classList.add('page-visible'); } catch (_) {}
      }
    })();
  </script>

  <!-- header include -->
  <div data-include="../../header.html"></div>

  <main class="wrap">
    <div class="grid">

      <section class="card" id="tictactoe" aria-labelledby="ttt-heading">
        <h1 id="ttt-heading">Tic-Tac-Toe</h1>

        <p style="margin-top:8px;">
          Play a quick game. Click or use the keyboard (arrow keys to move, Enter/Space to place).
        </p>

        <div class="ttt-area" style="margin-top:14px;">
          <div id="board" class="ttt-board" role="grid" aria-label="Tic Tac Toe board">
            <!-- cells created in markup for graceful fallback; script will make them interactive -->
            <div class="cell" role="gridcell" aria-label="cell 1" data-index="0" tabindex="0"></div>
            <div class="cell" role="gridcell" aria-label="cell 2" data-index="1" tabindex="0"></div>
            <div class="cell" role="gridcell" aria-label="cell 3" data-index="2" tabindex="0"></div>

            <div class="cell" role="gridcell" aria-label="cell 4" data-index="3" tabindex="0"></div>
            <div class="cell" role="gridcell" aria-label="cell 5" data-index="4" tabindex="0"></div>
            <div class="cell" role="gridcell" aria-label="cell 6" data-index="5" tabindex="0"></div>

            <div class="cell" role="gridcell" aria-label="cell 7" data-index="6" tabindex="0"></div>
            <div class="cell" role="gridcell" aria-label="cell 8" data-index="7" tabindex="0"></div>
            <div class="cell" role="gridcell" aria-label="cell 9" data-index="8" tabindex="0"></div>
          </div>

          <div style="margin-top:14px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
            <button id="reset" class="contact-link" type="button">Reset Game</button>
            <button id="swap" class="contact-link" type="button" title="Start with O / X">Swap First Player</button>
            <div id="status" aria-live="polite" style="margin-left:8px; color:var(--muted);"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- footer include -->
  <div data-include="../../footer.html"></div>

  <script src="script.js"></script>

  <script>
    (async function includeParts(){
      const nodes = document.querySelectorAll('[data-include]');
      for (const node of nodes) {
        const url = node.getAttribute('data-include');
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(res.statusText);
          node.innerHTML = await res.text();
        } catch (err) {
          console.error('Include failed:', url, err);
        }
      }
      const y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();

      // active nav highlighting (same logic as other pages)
      const normalize = (p) => {
        if (!p) return '/';
        try { const u = new URL(p, location.origin); p = u.pathname; } catch(e) {}
        if (p.endsWith('index.html')) p = p.slice(0, -'index.html'.length);
        if (!p.endsWith('/')) p += '/';
        return p;
      };

      const current = normalize(location.pathname);
      document.querySelectorAll('.nav a').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        if (normalize(href) === current) a.classList.add('active');
      });
    })();
  </script>

</body>
</html>

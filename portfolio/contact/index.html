<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Miles R. W. Judd</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <meta name="description" content="Contact Miles R. W. Judd — email, LinkedIn, and GitHub.">
</head>

<body>

  <!-- Defensive reveal snippet (same pattern as other pages) -->
  <script>
    (function () {
      try {
        function init() {
          document.body.style.overflow = '';
          document.body.classList.add('page-visible');
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else init();
      } catch (e) {
        try { document.body.classList.add('page-visible'); } catch (_) {}
      }
    })();
  </script>

  <!-- header include -->
  <div data-include="../header.html"></div>

  <main class="wrap">
    <div class="grid">

      <section class="card contact">
        <div class="contact-inner">
          <h1>Get in touch</h1>
          <p>
            If you’d like to discuss research, collaboration, or projects,
            feel free to reach out through any of the channels below.
          </p>

          <div class="contact-links">

            <!-- Email -->
            <a
              class="contact-link"
              href="mailto:miles.judd@eng.ox.ac.uk"
            >
              Email
            </a>

            <!-- LinkedIn -->
            <a
              class="contact-link"
              href="https://www.linkedin.com/in/miles-judd"
              target="_blank"
              rel="noopener"
            >
              LinkedIn
            </a>

            <!-- GitHub -->
            <a
              class="contact-link"
              href="https://github.com/milesjudd"
              target="_blank"
              rel="noopener"
            >
              GitHub
            </a>

          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- footer include -->
  <div data-include="../footer.html"></div>

  <script>
    (async function includeParts(){
      const nodes = document.querySelectorAll('[data-include]');
      for (const node of nodes) {
        const url = node.getAttribute('data-include');
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(res.statusText);
          node.innerHTML = await res.text();
        } catch (err) {
          console.error('Include failed:', url, err);
        }
      }

      // footer year
      const y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();

      // active nav highlighting (same logic as publications)
      const normalize = (p) => {
        if (!p) return '/';
        try {
          const u = new URL(p, location.origin);
          p = u.pathname;
        } catch (e) {}
        if (p.endsWith('index.html')) p = p.slice(0, -'index.html'.length);
        if (!p.endsWith('/')) p += '/';
        return p;
      };

      const current = normalize(location.pathname);
      document.querySelectorAll('.nav a').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        if (normalize(href) === current) {
          a.classList.add('active');
        }
      });
    })();
  </script>

</body>
</html>
